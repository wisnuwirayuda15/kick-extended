name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Least privilege by default; only the release job asks for write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint

      # Tag builds take @version from the tag, so a release can never ship a
      # stale version. Managers only re-install when @version increases, so a
      # stale one would silently reach nobody. Other builds use src/meta.ts.
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          USERSCRIPT_VERSION: ${{ steps.version.outputs.value }}
        run: bun run build

      - run: bun run check

      - name: Assert userscript metadata
        run: |
          set -euo pipefail
          user=dist/KickExtended.user.js
          meta=dist/KickExtended.meta.js

          head -1 "$user" | grep -q '==UserScript==' \
            || { echo "::error::the ==UserScript== block is missing from the top of the build"; exit 1; }

          check() { # name expected file
            local got
            got=$(grep -c "^// @$1" "$3" || true)
            [ "$got" = "$2" ] || { echo "::error::@$1: expected $2 in $3, found $got"; exit 1; }
          }
          for f in "$user" "$meta"; do
            check grant       4 "$f"
            check connect     3 "$f"
            check match       2 "$f"
            check require     1 "$f"
            check updateURL   1 "$f"
            check downloadURL 1 "$f"
          done

          # hls.js must stay a CDN @require. If it ever gets bundled the file
          # jumps from ~76 KB to ~1 MB.
          grep -q 'hls.min.js' "$user" \
            || { echo "::error::the hls.js @require is missing"; exit 1; }
          size=$(wc -c < "$user")
          [ "$size" -lt 300000 ] \
            || { echo "::error::build is ${size} bytes; hls.js was probably bundled"; exit 1; }

          # The two headers must agree, or the manager polls one version and
          # installs another.
          a=$(grep '^// @version' "$user"); b=$(grep '^// @version' "$meta")
          [ "$a" = "$b" ] || { echo "::error::@version differs: '$a' vs '$b'"; exit 1; }
          echo "metadata OK - $a"

      # dist/KickExtended.user.js is committed so it can be read from the repo.
      # Fail if someone changed src/ without rebuilding. Skipped on tags, where
      # the version override makes a difference on purpose.
      - name: Check committed build is current
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git diff --exit-code -- dist/KickExtended.user.js \
            || { echo "::error::dist/KickExtended.user.js is stale - run 'bun run build' and commit it"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: userscript
          path: |
            dist/KickExtended.user.js
            dist/KickExtended.meta.js
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: userscript
          path: dist

      - name: Assert the tag matches the built @version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          built=$(grep '^// @version' dist/KickExtended.user.js | awk '{print $3}')
          [ "$tag" = "$built" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match built @version $built"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/KickExtended.user.js \
            dist/KickExtended.meta.js \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
